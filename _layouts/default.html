<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title and page.layout != "home" %}{{ page.title }} – {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:ital,wght@0,400;0,600;0,800;1,400&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<nav class="nav" aria-label="Pages">
  <div class="nav-in">
    <img class="nav-crest" src="{{ '/assets/img/brd-crest.webp' | relative_url }}" alt="">
    <a class="nav-name" href="{{ '/' | relative_url }}">Puppy Panic</a>
    <a class="link" href="{{ '/' | relative_url }}"{% if page.nav == "bio" %} aria-current="page"{% endif %}>Bio</a>
    <a class="link" href="{{ '/news/' | relative_url }}"{% if page.nav == "news" or page.layout == "post" %} aria-current="page"{% endif %}>News</a>
    <a class="link" href="{{ '/gallery/' | relative_url }}"{% if page.nav == "gallery" %} aria-current="page"{% endif %}>Gallery</a>
  </div>
</nav>

{{ content }}

<footer><div class="in"><span>Puppy Panic #847</span><span>A fan page. Logo © Birmingham Roller Derby.</span></div></footer>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
